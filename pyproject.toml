[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-cycling-mcp"
version = "0.2.0"
description = "Author a structured cycling workout once; render it to MyWhoosh .zwo and Garmin Connect JSON."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Elias Ramzi" }]
keywords = ["mcp", "cycling", "workout", "zwo", "garmin", "mywhoosh"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["mcp>=1.2.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # 3.10 has no stdlib tomllib; without this the version lock-step test would
    # skip there rather than run.
    "tomli>=2.0; python_version < '3.11'",
    # The spec schema is published to callers, so a test validates real specs
    # against it. mcp happens to pull this in today; depending on that would
    # make the check vanish silently if it ever stopped.
    "jsonschema>=4.0",
]
live = ["garminconnect>=0.2.25"]  # only for the live Garmin round-trip test

[project.scripts]
claude-cycling-mcp = "cycling_mcp.server:main"

[project.urls]
Homepage = "https://github.com/elias-ramzi/ClaudeCyclingMCP"
Repository = "https://github.com/elias-ramzi/ClaudeCyclingMCP"

[tool.hatch.build.targets.wheel]
packages = ["src/cycling_mcp"]

# Ship the skills inside the wheel so a `uvx` install can serve them as MCP
# prompts. They stay at .claude/skills in the repo, where Claude Code reads
# them directly and where the Desktop zip step expects them.
[tool.hatch.build.targets.wheel.force-include]
".claude/skills" = "cycling_mcp/_skills"

[tool.ruff]
# Matches the 100-column style used across the author's other MCP repos.
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# PLW1514 is preview-only, and explicit-preview-rules keeps that opt-in to
# this one rule rather than to preview as a whole.
preview = true
explicit-preview-rules = true
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF",
    # Every file this project writes is UTF-8, so reading one back at the
    # platform default is a bug — and one that only shows on Windows, where
    # the default is cp1252. Caught in CI rather than by review.
    "PLW1514",
]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "RUF001", # ambiguous unicode: prose in docstrings legitimately uses en dashes
    "RUF002",
    "RUF003",
]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: touches the real Garmin Connect API (deselect with -m 'not live')"]
addopts = "-m 'not live'"
